<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamentals of Accounting — Prelim Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral:ital@1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE2; --paper-dark:#E7DFC9; --ink:#2A2620; --ink-soft:#57503F;
    --green:#1F3D2E; --rule:#C7D2C2; --rule-strong:#9FB29A;
    --brass:#A5723C; --brass-light:#C99A66; --white:#FBF9F3; --err:#8B3A2F;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; line-height:1.55; padding-bottom:90px; }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none;
    background-image:repeating-linear-gradient(to bottom, transparent, transparent 37px, var(--rule) 38px);
    opacity:.35; z-index:0; }
  .wrap{ position:relative; z-index:1; max-width:820px; margin:0 auto; padding:0 20px; }

  .cover{ background:var(--green); color:var(--white); padding:56px 20px 44px; text-align:center; position:relative; overflow:hidden; }
  .cover::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 18px, transparent 18px 26px); opacity:.8; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; letter-spacing:3px; font-size:12px; text-transform:uppercase; color:var(--brass-light); margin:0 0 14px; }
  .cover h1{ font-family:'Spectral',serif; font-weight:700; font-size:clamp(28px,5vw,42px); margin:0 0 10px; }
  .cover p.sub{ font-family:'Spectral',serif; font-style:italic; font-size:16px; color:#DCE6DE; max-width:480px; margin:0 auto; }

  .student-strip{ background:var(--white); border:1px solid var(--rule-strong); border-top:none;
    display:grid; grid-template-columns:1.4fr 1fr 1fr; margin:0 20px; box-shadow:0 6px 14px rgba(31,61,46,.08); }
  @media (max-width:600px){ .student-strip{ grid-template-columns:1fr; } }
  .student-strip .field{ padding:14px 18px; border-right:1px dashed var(--rule-strong); }
  .student-strip .field:last-child{ border-right:none; }
  .student-strip label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px; }
  .student-strip input{ width:100%; border:none; border-bottom:1px solid var(--rule-strong); background:transparent; font-family:'Spectral',serif; font-size:16px; padding:3px 0; color:var(--ink); }
  .student-strip input:focus{ outline:none; border-bottom:1px solid var(--brass); }

  .sync-bar{ margin:0 20px; padding:8px 18px; background:var(--paper-dark); border:1px solid var(--rule-strong); border-top:none;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; }
  .sync-bar.err{ color:var(--err); }

  .parts-nav{ position:sticky; top:0; z-index:5; display:flex; gap:2px; background:var(--paper-dark); border-bottom:1px solid var(--rule-strong); margin-top:26px; flex-wrap:wrap; }
  .parts-nav a{ flex:1; text-align:center; padding:12px 6px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.5px; text-transform:uppercase; text-decoration:none; color:var(--ink-soft); border-bottom:3px solid transparent; white-space:nowrap; }
  .parts-nav a:hover,.parts-nav a:focus-visible{ color:var(--green); border-bottom-color:var(--brass-light); }

  section.part{ background:var(--white); margin:22px 20px 0; border:1px solid var(--rule-strong); border-radius:3px; }
  .part-head{ padding:22px 26px 14px; border-bottom:1px dashed var(--rule-strong); }
  .part-head .tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--brass); }
  .part-head h2{ font-family:'Spectral',serif; font-size:24px; margin:6px 0 4px; color:var(--green); }
  .part-head .note{ font-size:13.5px; color:var(--ink-soft); }

  .item{ padding:20px 26px; border-bottom:1px solid var(--rule); display:flex; gap:14px; }
  .item:last-child{ border-bottom:none; }
  .item-num{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--green); min-width:30px; padding-top:2px; }
  .stamp{ display:inline-block; margin-left:4px; font-size:10px; color:var(--brass); opacity:0; transform:scale(.4) rotate(-8deg); transition:transform .25s ease, opacity .25s ease; }
  .stamp.on{ opacity:1; transform:scale(1) rotate(-8deg); }
  .item-body{ flex:1; min-width:0; }
  .q-text{ margin:0 0 10px; font-size:15.5px; }
  .q-group{ margin:0 0 8px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--brass); font-weight:600; }
  .q-intro{ margin:0 0 10px; font-size:13.5px; color:var(--ink-soft); }
  .choices{ display:grid; gap:8px; }
  .choice{ display:flex; align-items:flex-start; gap:10px; font-size:14.5px; cursor:pointer; }
  .choice input[type="radio"]{ accent-color:var(--green); margin-top:3px; flex-shrink:0; }
  .text-answer{ width:100%; border:none; border-bottom:1px solid var(--rule-strong); background:transparent; font-family:'Spectral',serif; font-size:15px; padding:5px 2px; color:var(--ink); }
  .text-answer:focus{ outline:none; border-bottom:1px solid var(--brass); }
  textarea.text-answer{ resize:vertical; min-height:90px; border:1px solid var(--rule-strong); border-radius:3px; padding:10px 12px; font-family:'IBM Plex Mono',monospace; font-size:13.5px; line-height:1.6; }
  textarea.text-answer:focus{ border-color:var(--brass); }

  .progress-footer{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--green); color:var(--white); padding:12px 20px; display:flex; align-items:center; gap:18px; box-shadow:0 -6px 14px rgba(0,0,0,.15); }
  .progress-track{ flex:1; height:8px; background:rgba(255,255,255,.18); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:var(--brass-light); transition:width .35s ease; }
  .progress-label{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; white-space:nowrap; }
  .footer-actions{ display:flex; gap:8px; }
  .footer-actions button{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.5px; text-transform:uppercase; background:transparent; color:var(--white); border:1px solid rgba(255,255,255,.4); border-radius:3px; padding:8px 12px; cursor:pointer; }
  .footer-actions button:hover{ background:rgba(255,255,255,.12); border-color:var(--brass-light); }

  .toast{
    position:fixed; left:50%; bottom:76px; transform:translateX(-50%) translateY(20px);
    background:var(--green); color:var(--white); border:1px solid var(--brass-light);
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.3px;
    padding:10px 18px; border-radius:4px; box-shadow:0 6px 16px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:20;
  }
  .toast.err{ background:var(--err); border-color:var(--err); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer.end{ text-align:center; padding:30px 20px; font-family:'Spectral',serif; font-style:italic; color:var(--ink-soft); font-size:14px; }
  .teacher-link{ text-align:center; padding-bottom:20px; }
  .teacher-link a{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); text-decoration:none; letter-spacing:.5px; }
  .teacher-link a:hover{ color:var(--brass); }

  @media (max-width:600px){ .item{ padding:16px 18px; gap:10px; } .part-head{ padding:18px 18px 12px; } .parts-nav a{ font-size:10.5px; padding:10px 4px; } .progress-footer{ flex-wrap:wrap; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }
  @media print{ body::before{ display:none; } .parts-nav,.progress-footer,.sync-bar,.teacher-link{ display:none !important; } .cover{ -webkit-print-color-adjust:exact; print-color-adjust:exact; } section.part{ break-inside:avoid-page; } body{ padding-bottom:0; } }
</style>
</head>
<body>

<div class="cover">
  <p class="eyebrow">Prelim Questionnaire</p>
  <h1>Fundamentals of Accounting</h1>
  <p class="sub">Covering the accounting equation, journals, ledgers, adjusting entries, and financial statements. Your answers save automatically.</p>
</div>

<div class="student-strip">
  <div class="field"><label for="s-name">Name</label><input id="s-name" type="text" placeholder="Juan Dela Cruz"></div>
  <div class="field"><label for="s-section">Section</label><input id="s-section" type="text" placeholder="BSA 1-A"></div>
  <div class="field"><label for="s-date">Date</label><input id="s-date" type="date"></div>
</div>
<div class="sync-bar" id="sync-bar"><span id="sync-status">Connecting…</span><span id="sync-id"></span></div>

<nav class="parts-nav" id="parts-nav"></nav>

<div class="wrap" style="padding:0;" id="sections-wrap"></div>

<footer class="end">— End of Questionnaire —</footer>

<div class="progress-footer">
  <span class="progress-label" id="progress-label">0 / 0 answered</span>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="footer-actions">
    <button id="btn-print" type="button">Print / Save PDF</button>
    <button id="btn-download" type="button">Download Test Paper</button>
    <button id="btn-email" type="button">Email to Teacher</button>
    <button id="btn-save-now" type="button">Save Now</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
// ====== FILL THIS IN — see SETUP.md ======
const firebaseConfig = {
  apiKey: "AIzaSyBRGWPrfZP7pPHMqDZIScoWjnNsceE5nS8",
  authDomain: "accounting-exam-9770a.firebaseapp.com",
  projectId: "accounting-exam-9770a",
  storageBucket: "accounting-exam-9770a.firebasestorage.app",
  messagingSenderId: "236355714736",
  appId: "1:236355714736:web:8b83481da3a6d355ca0575",
  measurementId: "G-484SPHFWQP"
};
// ==========================================

// TEACHER: put the email address that should receive students' test papers here.
// Leave it blank ("") if you'd rather have students type the recipient themselves.
const TEACHER_CONTACT_EMAIL = "";

// TEACHER: after deploying the Cloud Function (see EMAIL_SETUP.md), paste its URL here.
// While this is blank, the Email button falls back to download + open-email-app (manual attach).
const EMAIL_FUNCTION_URL = "";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const letters = ['a','b','c','d'];

// Fallback used only if the "sections" collection hasn't been set up yet in Firestore.
const DEFAULT_SECTIONS = [
  { key:'mc', label:'Multiple Choice', note:'Select the letter of the correct answer.', inputType:'mc', enabled:true, order:1 },
  { key:'tf', label:'True or False', note:'Select True or False for each statement.', inputType:'tf', enabled:true, order:2 },
  { key:'id', label:'Identification', note:'Write the term or concept being described.', inputType:'text', enabled:true, order:3 },
  { key:'ps', label:'Problem Solving', note:'Show your complete solution where applicable.', inputType:'textarea', enabled:true, order:4 }
];

let uid = null;
let sections = [];
let allQuestions = [];
let answers = {};
let total = 0;
let saveTimer = null;

function setStatus(text, isErr){
  document.getElementById('sync-status').textContent = text;
  document.getElementById('sync-bar').classList.toggle('err', !!isErr);
}

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2500);
}

function buildLayout(){
  const nav = document.getElementById('parts-nav');
  const wrap = document.getElementById('sections-wrap');
  nav.innerHTML = '';
  wrap.innerHTML = '';
  sections.forEach(sec => {
    const a = document.createElement('a');
    a.href = '#sec-' + sec.key;
    a.id = 'nav-' + sec.key;
    nav.appendChild(a);

    const section = document.createElement('section');
    section.className = 'part';
    section.id = 'sec-' + sec.key;
    section.innerHTML = `
      <div class="part-head">
        <p class="tag" id="tag-${sec.key}"></p>
        <h2>${sec.label}</h2>
        <p class="note">${sec.note || ''}</p>
      </div>
      <div id="items-${sec.key}"></div>`;
    wrap.appendChild(section);
  });
}

function renderItemHTML(sec, q, displayNum){
  const stamp = `<span class="stamp" data-stamp="${q.num}">\u2713</span>`;
  if (sec.inputType === 'mc'){
    return `<div class="item-num">${displayNum}. ${stamp}</div>
      <div class="item-body">
        <p class="q-text">${q.text}</p>
        <div class="choices">
          ${(q.choices||[]).map((c,ci)=>`<label class="choice"><input type="radio" name="q${q.num}" value="${letters[ci]}" data-qnum="${q.num}"><span>${letters[ci]}) ${c}</span></label>`).join('')}
        </div>
      </div>`;
  }
  if (sec.inputType === 'tf'){
    return `<div class="item-num">${displayNum}. ${stamp}</div>
      <div class="item-body">
        <p class="q-text">${q.text}</p>
        <div class="choices">
          <label class="choice"><input type="radio" name="q${q.num}" value="true" data-qnum="${q.num}"><span>True</span></label>
          <label class="choice"><input type="radio" name="q${q.num}" value="false" data-qnum="${q.num}"><span>False</span></label>
        </div>
      </div>`;
  }
  if (sec.inputType === 'textarea'){
    const groupHtml = q.group ? `<p class="q-group">${q.group}</p>` : '';
    const introHtml = q.intro ? `<p class="q-intro">${q.intro}</p>` : '';
    return `<div class="item-num">${displayNum}. ${stamp}</div>
      <div class="item-body">${groupHtml}${introHtml}<p class="q-text">${q.text}</p>
      <textarea class="text-answer" rows="3" placeholder="Show your solution / answer" data-qnum="${q.num}"></textarea></div>`;
  }
  // default: single-line text
  return `<div class="item-num">${displayNum}. ${stamp}</div>
    <div class="item-body"><p class="q-text">${q.text}</p>
    <input type="text" class="text-answer" placeholder="Your answer" data-qnum="${q.num}"></div>`;
}

function renderQuestions(){
  const counts = {};
  sections.forEach(sec => {
    const container = document.getElementById('items-' + sec.key);
    container.innerHTML = '';
    const items = allQuestions.filter(q => q.type === sec.key);
    counts[sec.key] = items.length;
    items.forEach((q, idx) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = renderItemHTML(sec, q, idx + 1);
      container.appendChild(div);
    });
  });
  total = allQuestions.length;

  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
  let visibleIndex = 0;
  sections.forEach(sec => {
    const sectionEl = document.getElementById('sec-' + sec.key);
    const navEl = document.getElementById('nav-' + sec.key);
    const count = counts[sec.key] || 0;
    const show = sec.enabled !== false && count > 0;
    if (show){
      sectionEl.style.display = '';
      navEl.style.display = '';
      const roman = ROMAN[visibleIndex] || String(visibleIndex + 1);
      document.getElementById('tag-' + sec.key).textContent = `Part ${roman} · ${count} item${count===1?'':'s'}`;
      navEl.textContent = `Part ${roman} · ${sec.label}`;
      visibleIndex++;
    } else {
      sectionEl.style.display = 'none';
      navEl.style.display = 'none';
    }
  });
}

function applyAnswersToInputs(){
  document.querySelectorAll('[data-qnum]').forEach(el => {
    const n = el.getAttribute('data-qnum');
    const val = answers[n];
    if (val === undefined || val === null) return;
    if (el.type === 'radio'){ el.checked = (el.value === val); }
    else { el.value = val; }
  });
  updateProgress();
}

function readAnswersFromInputs(){
  document.querySelectorAll('[data-qnum]').forEach(el => {
    const n = el.getAttribute('data-qnum');
    if (el.type === 'radio'){ if (el.checked) answers[n] = el.value; }
    else { const v = el.value.trim(); if (v) answers[n] = v; else delete answers[n]; }
  });
}

function updateProgress(){
  const answeredCount = Object.keys(answers).length;
  for (let i = 1; i <= total; i++){
    const stamp = document.querySelector(`[data-stamp="${i}"]`);
    if (stamp) stamp.classList.toggle('on', answers[String(i)] !== undefined);
  }
  document.getElementById('progress-label').textContent = `${answeredCount} / ${total} answered`;
  document.getElementById('progress-fill').style.width = (total ? (answeredCount/total*100) : 0) + '%';
}

function scheduleSave(){
  setStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => doSave(false), 900);
}

async function doSave(manual){
  if (!uid){
    if (manual) showToast('Still connecting — please wait a moment and try again.', true);
    return;
  }
  readAnswersFromInputs();
  updateProgress();
  const payload = {
    name: document.getElementById('s-name').value.trim(),
    section: document.getElementById('s-section').value.trim(),
    date: document.getElementById('s-date').value,
    responses: answers,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    await db.collection('answers').doc(uid).set(payload, { merge: true });
    setStatus('All changes saved.');
    if (manual) showToast('✓ Your answers were saved.');
  } catch (e){
    setStatus('Save failed — check connection. (' + e.message + ')', true);
    if (manual) showToast('Save failed: ' + e.message, true);
  }
}

document.addEventListener('input', scheduleSave);
document.addEventListener('change', scheduleSave);
document.getElementById('btn-print').addEventListener('click', () => window.print());

function buildTestPaperText(){
  readAnswersFromInputs();
  const name = document.getElementById('s-name').value.trim() || 'Student';
  const secField = document.getElementById('s-section').value.trim();
  const date = document.getElementById('s-date').value;

  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
  let out = 'FUNDAMENTALS OF ACCOUNTING — TEST PAPER\n';
  out += `Name: ${name}\n`;
  if (secField) out += `Section: ${secField}\n`;
  if (date) out += `Date: ${date}\n`;
  out += '\n' + '='.repeat(60) + '\n';

  let visibleIndex = 0;
  sections.forEach(sec => {
    const items = allQuestions.filter(q => q.type === sec.key);
    if (sec.enabled === false || items.length === 0) return;
    const roman = ROMAN[visibleIndex] || String(visibleIndex + 1);
    visibleIndex++;
    out += `\nPART ${roman} — ${sec.label.toUpperCase()}\n` + '-'.repeat(60) + '\n';
    items.forEach((q, idx) => {
      const raw = answers[String(q.num)];
      let answerText = '(no answer)';
      if (raw !== undefined && raw !== null && raw !== ''){
        if (sec.inputType === 'mc'){
          const ci = letters.indexOf(raw);
          const choiceText = (ci >= 0 && q.choices && q.choices[ci]) ? q.choices[ci] : '';
          answerText = raw + (choiceText ? ') ' + choiceText : '');
        } else if (sec.inputType === 'tf'){
          answerText = raw === 'true' ? 'True' : 'False';
        } else {
          answerText = raw;
        }
      }
      out += `\n${idx + 1}. ${q.text}\n   Your answer: ${answerText}\n`;
    });
    out += '\n';
  });
  out += '='.repeat(60) + '\nGenerated from the Fundamentals of Accounting quiz page.\n';

  return { text: out, name, filename: `${name.replace(/\s+/g,'_')}_accounting_test_paper.txt` };
}

function downloadTextFile(text, filename){
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btn-download').addEventListener('click', () => {
  const { text, filename } = buildTestPaperText();
  downloadTextFile(text, filename);
  showToast('✓ Test paper downloaded — you can now attach and send it to your teacher.');
});

document.getElementById('btn-email').addEventListener('click', async () => {
  const { text, name, filename } = buildTestPaperText();
  const btn = document.getElementById('btn-email');

  if (!EMAIL_FUNCTION_URL){
    // Fallback: backend not deployed yet — download the file and open the mail app for manual attach.
    downloadTextFile(text, filename);
    const subject = `Accounting Test Paper — ${name}`;
    const body = `Hi,\n\nAttached is my completed Fundamentals of Accounting test paper.\n\n` +
      `A file named "${filename}" was just downloaded to your Downloads folder — ` +
      `please attach it to this email before sending.\n\n` +
      `Name: ${name}\n`;
    const mailto = `mailto:${encodeURIComponent(TEACHER_CONTACT_EMAIL)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    showToast('✓ Downloaded — opening your email app. Please attach the downloaded file.');
    setTimeout(() => { window.location.href = mailto; }, 600);
    return;
  }

  // Real send: no manual attach needed.
  btn.disabled = true;
  showToast('Sending your test paper…');
  try {
    const resp = await fetch(EMAIL_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentName: name, teacherEmail: TEACHER_CONTACT_EMAIL, testPaperText: text, filename })
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.ok && data.success){
      showToast('✓ Test paper emailed to your teacher.');
    } else {
      showToast('Send failed: ' + (data.error || 'unknown error') + ' — try Download instead.', true);
    }
  } catch (e){
    showToast('Send failed: ' + e.message + ' — try Download instead.', true);
  }
  btn.disabled = false;
});

document.getElementById('btn-save-now').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save-now');
  btn.disabled = true;
  await doSave(true);
  btn.disabled = false;
});

auth.onAuthStateChanged(async user => {
  if (!user) return;
  uid = user.uid;
  document.getElementById('sync-id').textContent = 'ID: ' + uid.slice(0,8);
  setStatus('Loading questionnaire…');
  try {
    const secSnap = await db.collection('sections').orderBy('order').get();
    sections = secSnap.empty ? DEFAULT_SECTIONS.slice() : secSnap.docs.map(d => d.data());
    buildLayout();

    const qSnap = await db.collection('questions').orderBy('num').get();
    allQuestions = qSnap.docs.map(d => d.data());
    if (allQuestions.length === 0){
      setStatus('No questions found yet — ask your teacher to publish the questionnaire.', true);
      return;
    }
    renderQuestions();

    const aSnap = await db.collection('answers').doc(uid).get();
    if (aSnap.exists){
      const data = aSnap.data();
      answers = data.responses || {};
      document.getElementById('s-name').value = data.name || '';
      document.getElementById('s-section').value = data.section || '';
      document.getElementById('s-date').value = data.date || '';
    }
    applyAnswersToInputs();
    setStatus('Ready. Your answers save automatically.');
  } catch (e){
    setStatus('Could not load questionnaire. (' + e.message + ')', true);
  }
});

auth.signInAnonymously().catch(e => setStatus('Could not connect. (' + e.message + ')', true));
</script>
</body>
</html>
